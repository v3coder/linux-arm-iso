
name: Build ARM64 Light ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap live-build xorriso squashfs-tools debian-archive-keyring

      - name: Configure Live Build for ARM64
        run: |
          mkdir -p live-system/config
          cd live-system
          
          # Added --security false to avoid unrecognized mirror flags and 404 errors
          lb config \
              --architecture arm64 \
              --distribution bookworm \
              --debian-installer none \
              --archive-areas "main contrib non-free non-free-firmware" \
              --binary-images iso-hybrid \
              --apt-recommends false \
              --memtest none \
              --security false \
              --mirror-bootstrap "http://deb.debian.org/debian/" \
              --mirror-chroot "http://deb.debian.org/debian/" \
              --mirror-binary "http://deb.debian.org/debian/"

          mkdir -p config/package-lists
          
          cat << 'EOF' > config/package-lists/desktop.list.chroot
          xorg
          xinit
          openbox
          tint2
          picom
          pcmanfm
          lxterminal
          network-manager
          curl
          wget
          sudo
          ca-certificates
          EOF

      - name: Build ARM64 ISO
        run: |
          cd live-system
          sudo lb build

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UltraLight_Win11Style_ARM64_ISO
          path: live-system/*.iso
